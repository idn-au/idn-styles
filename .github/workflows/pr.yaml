name: Type check & build on PR

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - idn-lib/**
      - .github/workflows/pr.yaml
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install dependencies
        working-directory: idn-lib
        run: pnpm install
      - name: Type check
        working-directory: idn-lib
        run: pnpm types
      - name: Run build
        working-directory: idn-lib
        run: pnpm build
